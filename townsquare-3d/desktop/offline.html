<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Townsquare3D</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #14110f; color: #f2ede6; }
    main { max-width: 420px; padding: 32px; text-align: center; }
    .mark { width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 18px; background: #d9a441; color: #14110f; display: grid; place-items: center; font: 700 30px/1 Georgia, serif; }
    h1 { font-size: 24px; margin: 0 0 8px; }
    p { color: #c9c1b6; margin: 0 0 24px; }
    a { display: inline-block; padding: 12px 28px; border-radius: 14px; background: #d9a441; color: #14110f; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">T</div>
    <h1>Townsquare3D can't reach the internet</h1>
    <p>Townsquare3D needs a connection the first time it opens. After that it also opens offline. Check your connection and try again.</p>
    <a href="https://juw12.github.io/portfolio/townsquare-3d/">Try again</a>
  </main>
</body>
</html>
