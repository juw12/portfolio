name: Sync project cards from apps.json

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v4
        with:
          path: portfolio

      - name: Checkout projects (catalog source)
        uses: actions/checkout@v4
        with:
          repository: juw12/projects
          path: projects

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate the managed project cards
        run: python projects/scripts/publish_portfolio.py --portfolio-dir portfolio --no-notes --allow-card-issues

      - name: Rebuild the RSS feed (feed.xml) for RSS-to-email
        run: python portfolio/scripts/build_feed.py --apps projects/scripts/apps.json --portfolio-dir portfolio

      - name: Open a Substack draft for newly shipped projects
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python portfolio/scripts/notify_substack_draft.py portfolio

      - name: Commit and push if the catalog changed
        working-directory: portfolio
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore(projects): auto-sync project cards from apps.json"
            git push
          else
            echo "Catalog unchanged - nothing to do."
          fi
