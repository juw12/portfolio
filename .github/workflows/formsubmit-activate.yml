name: FormSubmit check (one-off)

# Sends one real AI Daily signup through FormSubmit (as juwpegatron+aidaily@gmail.com,
# which lands in the owner's own inbox) and fails unless FormSubmit accepts it.
# Runs when this file is pushed or by hand; safe to delete afterwards.

on:
  push:
    paths:
      - .github/workflows/formsubmit-activate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Submit a test signup
        run: |
          response=$(curl -sS -m 60 -X POST "https://formsubmit.co/ajax/juwpegatron@gmail.com" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -H "Referer: https://juwenlie.pages.dev/hi/" \
            -H "Origin: https://juwenlie.pages.dev" \
            --data '{"email":"juwpegatron+aidaily@gmail.com","list":"AI Daily","page":"https://juwenlie.pages.dev/hi/","_subject":"AI Daily: subscribe","_template":"table","_captcha":"false"}')
          echo "::notice title=FormSubmit reply::$(echo "$response" | head -c 600 | tr '\n' ' ')"
          echo "$response" | grep -q '"success":"true"'
