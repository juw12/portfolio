name: AI Daily

# Builds the public AI Daily edition at /news/ every morning and emails it to
# every subscriber from Gmail (signups arrive in that inbox via FormSubmit;
# free, ~500 emails/day). The brief is written by an open model (Qwen3 8B)
# running in Ollama inside this free runner - no API key, no quota. Email needs
# the GMAIL_APP_PASSWORD repository secret; until it exists the web edition
# still publishes and the send step is skipped.
#
# Manual runs (Actions tab > AI Daily > Run workflow):
#   check         count signups/unsubscribes in the inbox, send nothing (~1 min)
#   test          email today's edition only to the sender's own inbox (builds
#                 an unpublished edition first if today's isn't out yet)
#   publish       rebuild and publish today's edition, no email
#   publish+send  rebuild, publish and email every subscriber (once per day)

on:
  schedule:
    # Off the top of the hour: GitHub delays or drops scheduled runs at the
    # hourly peak (the 23:00 UTC slot was dropped on 2026-10-29). The second
    # slot is a safety net - it does nothing if the first one already ran.
    - cron: "37 22 * * *"   # 05:37 WIB (UTC+7), every day
    - cron: "43 23 * * *"   # 06:43 WIB backup
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        options:
          - check
          - test
          - publish
          - publish+send
        default: check

permissions:
  contents: write

concurrency:
  group: ai-daily
  cancel-in-progress: false

jobs:
  edition:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BRIEF_MODEL: qwen3:8b
    steps:
      - uses: actions/checkout@v4

      - name: Is today's edition already out?
        id: today
        run: |
          today=$(TZ=Asia/Jakarta date +%F)
          built=false
          if [ "${{ inputs.mode }}" = "check" ]; then
            built=true
          elif [ -f "news/email/$today.json" ]; then
            case "${{ github.event_name }}/${{ inputs.mode }}" in
              schedule/* | workflow_dispatch/test)
                echo "Edition $today is already published - reusing it."
                built=true
                ;;
            esac
          fi
          echo "built=$built" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet requests beautifulsoup4

      - name: Cache the brief model
        if: steps.today.outputs.built != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-qwen3-8b-v1

      - name: Start the brief model (Ollama, local to this runner)
        if: steps.today.outputs.built != 'true'
        continue-on-error: true   # without it the brief falls back to top headlines
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama 2>/dev/null || true
          OLLAMA_MODELS="$HOME/.ollama/models" nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for attempt in $(seq 1 60); do
            curl -sf http://127.0.0.1:11434/api/tags > /dev/null && break
            sleep 1
          done
          ollama pull "$BRIEF_MODEL"
          ollama list

      - name: Build today's edition
        if: steps.today.outputs.built != 'true'
        run: python scripts/ai_daily/build_ai_daily.py build

      - name: Publish to the site
        if: steps.today.outputs.built != 'true' && (github.event_name == 'schedule' || inputs.mode != 'test')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news
          if git diff --cached --quiet; then
            echo "Nothing new to publish."
            exit 0
          fi
          git commit -m "AI Daily: $(date -u -d '+7 hours' +%Y-%m-%d) edition"
          for attempt in 1 2 3; do
            git pull --rebase --quiet && git push && exit 0
            sleep 5
          done
          exit 1

      - name: Wait for the web edition to go live
        if: steps.today.outputs.built != 'true' && (github.event_name == 'schedule' || inputs.mode == 'publish+send')
        run: sleep 90

      - name: Email subscribers
        if: github.event_name == 'schedule' || inputs.mode == 'publish+send'
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
        run: |
          python scripts/ai_daily/build_ai_daily.py send
          git add news/sent.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "AI Daily: mark $(date -u -d '+7 hours' +%Y-%m-%d) as sent"
            git pull --rebase --quiet && git push
          fi

      - name: Count signups in the inbox (sends nothing)
        if: inputs.mode == 'check'
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
        run: python scripts/ai_daily/build_ai_daily.py send --dry-run

      - name: Email a test copy to the sender only
        if: inputs.mode == 'test'
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
        run: python scripts/ai_daily/build_ai_daily.py send --test-to self
