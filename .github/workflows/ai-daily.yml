name: AI Daily

# Builds the public AI Daily edition at /news/ every morning and emails it to
# the AI Daily Google Group (free, no member cap). The brief is written by GitHub
# Models (free, uses the workflow token). Email needs the GMAIL_APP_PASSWORD
# repository secret; until it exists the web edition still publishes and the
# send step is skipped.

on:
  schedule:
    - cron: "0 23 * * *"   # 06:00 WIB (UTC+7), every day
  workflow_dispatch:
    inputs:
      send:
        description: "Email today's edition to subscribers"
        type: boolean
        default: false

permissions:
  contents: write
  models: read

concurrency:
  group: ai-daily
  cancel-in-progress: false

jobs:
  edition:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet requests beautifulsoup4

      - name: Build today's edition
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/ai_daily/build_ai_daily.py build

      - name: Publish to the site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news
          if git diff --cached --quiet; then
            echo "Nothing new to publish."
            exit 0
          fi
          git commit -m "AI Daily: $(date -u -d '+7 hours' +%Y-%m-%d) edition"
          for attempt in 1 2 3; do
            git pull --rebase --quiet && git push && exit 0
            sleep 5
          done
          exit 1

      - name: Wait for the web edition to go live
        if: github.event_name == 'schedule' || inputs.send
        run: sleep 90

      - name: Email subscribers
        if: github.event_name == 'schedule' || inputs.send
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
        run: |
          python scripts/ai_daily/build_ai_daily.py send
          git add news/sent.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "AI Daily: mark $(date -u -d '+7 hours' +%Y-%m-%d) as sent"
            git pull --rebase --quiet && git push
          fi
