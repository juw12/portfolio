name: AI Daily

# Builds the public AI Daily edition at /news/ every morning and emails it to
# every subscriber from Gmail (signups arrive in that inbox via FormSubmit;
# free, ~500 emails/day). The brief is written by GitHub Models (free, uses the
# workflow token). Email needs the GMAIL_APP_PASSWORD repository secret; until
# it exists the web edition still publishes and the send step is skipped.
#
# Manual runs (Actions tab > AI Daily > Run workflow):
#   test          build today's edition WITHOUT publishing and email it only
#                 to the sender's own inbox - safe to run any time
#   publish       rebuild and publish today's edition, no email
#   publish+send  rebuild, publish and email every subscriber (once per day)

on:
  schedule:
    - cron: "0 23 * * *"   # 06:00 WIB (UTC+7), every day
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        options:
          - test
          - publish
          - publish+send
        default: test

permissions:
  contents: write
  models: read

concurrency:
  group: ai-daily
  cancel-in-progress: false

jobs:
  edition:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet requests beautifulsoup4

      - name: Build today's edition
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/ai_daily/build_ai_daily.py build

      - name: Publish to the site
        if: github.event_name == 'schedule' || inputs.mode != 'test'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news
          if git diff --cached --quiet; then
            echo "Nothing new to publish."
            exit 0
          fi
          git commit -m "AI Daily: $(date -u -d '+7 hours' +%Y-%m-%d) edition"
          for attempt in 1 2 3; do
            git pull --rebase --quiet && git push && exit 0
            sleep 5
          done
          exit 1

      - name: Wait for the web edition to go live
        if: github.event_name == 'schedule' || inputs.mode == 'publish+send'
        run: sleep 90

      - name: Email subscribers
        if: github.event_name == 'schedule' || inputs.mode == 'publish+send'
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
        run: |
          python scripts/ai_daily/build_ai_daily.py send
          git add news/sent.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "AI Daily: mark $(date -u -d '+7 hours' +%Y-%m-%d) as sent"
            git pull --rebase --quiet && git push
          fi

      - name: Email a test copy to the sender only
        if: inputs.mode == 'test'
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
        run: python scripts/ai_daily/build_ai_daily.py send --test-to self
