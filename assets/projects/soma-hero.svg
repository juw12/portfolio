<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="SOMA: AI-native parametric CAD — a CadQuery code panel beside a rebuilt parametric part and a build log">
  <defs>
    <linearGradient id="somaPaper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf8f3"/>
      <stop offset="1" stop-color="#f1ece1"/>
    </linearGradient>
    <linearGradient id="somaInk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b1a1a"/>
      <stop offset="1" stop-color="#6b1414"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#somaPaper)"/>
  <rect x="0" y="0" width="1280" height="8" fill="url(#somaInk)"/>
  <text x="72" y="118" font-family="Georgia, 'Times New Roman', serif" font-size="72" fill="#1a1a1a">SOMA</text>
  <text x="76" y="158" font-family="'Segoe UI', Arial, sans-serif" font-size="22" letter-spacing="3" fill="#8b1a1a">AI-NATIVE PARAMETRIC CAD</text>
  <text x="76" y="196" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#6b6b6b">Describe the part · the agent writes CadQuery · SOMA builds it</text>

  <g transform="translate(76,244)">
    <rect x="0" y="0" width="560" height="392" rx="8" fill="#141414"/>
    <rect x="0" y="0" width="560" height="36" rx="8" fill="#0f0f0f"/>
    <circle cx="24" cy="18" r="5" fill="#8b1a1a"/>
    <text x="46" y="24" font-family="Consolas, monospace" font-size="14" fill="#9a9a9a">case.py</text>
    <g font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#d7d2c8">
      <text x="24" y="76">import cadquery as cq</text>
      <text x="24" y="102" fill="#7dcb9a">result = (cq.Workplane("XY")</text>
      <text x="24" y="128" fill="#d7d2c8">  .box(120, 80, 40)</text>
      <text x="24" y="154" fill="#d7d2c8">  .faces("&gt;Z").shell(-3)</text>
      <text x="24" y="180" fill="#d7d2c8">  .edges("|Z").fillet(4))</text>
      <text x="24" y="214" fill="#9a9a9a"># parameters</text>
      <text x="24" y="240" fill="#e0b15e">wall  = 3.0</text>
      <text x="24" y="266" fill="#e0b15e">vents = 6</text>
      <text x="24" y="300" fill="#9a9a9a">$ soma build</text>
      <text x="24" y="326" fill="#7dcb9a">✓ rebuilt in 0.42s · 12 faces</text>
      <text x="24" y="352" fill="#9a9a9a">$ soma export --fmt step stl 3mf</text>
    </g>
  </g>

  <g transform="translate(700,300)">
    <polygon points="0,60 150,0 150,120 0,180" fill="#e6e0d3" stroke="#1a1a1a" stroke-width="3"/>
    <polygon points="150,0 260,-46 260,74 150,120" fill="#f4efe4" stroke="#1a1a1a" stroke-width="3"/>
    <polygon points="0,60 110,14 260,74 150,120" fill="#ded7c7" stroke="#1a1a1a" stroke-width="3"/>
    <rect x="34" y="86" width="40" height="18" rx="3" fill="#8b1a1a" opacity="0.85"/>
    <rect x="86" y="70" width="40" height="18" rx="3" fill="#8b1a1a" opacity="0.65"/>
    <path d="M150 0 L150 120" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="-6" y="212" font-family="Consolas, monospace" font-size="15" fill="#6b6b6b">FEM · mass · wall thickness</text>
  </g>

  <text x="76" y="676" font-family="'Segoe UI', Arial, sans-serif" font-size="17" fill="#8b1a1a">Open-source · GPL-3.0 · Windows · macOS · Linux</text>
</svg>
