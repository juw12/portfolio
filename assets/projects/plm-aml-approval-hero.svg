<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="PLM AML Approval Assistant: six automated steps from part search to a fully verified approval form, stopping before Submit for a human check">
  <defs>
