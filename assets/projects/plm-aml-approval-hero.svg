    <text x="20" y="124" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="19" fill="#6b645c">零件承認</text>
  </g>  <path d="M314 285 h22" stroke="#8b1a1a" stroke-width="3" marker-end="url(#arrow)"/>
