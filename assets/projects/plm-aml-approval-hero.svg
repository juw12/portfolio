    <text x="20" y="124" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="19" fill="#6b645c">create / re-link</text>
  </g>  <path d="M314 475 h22" stroke="#8b1a1a" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(340,400)">
    <rect width="220" height="150" rx="14" fill="#fbf9f5" stroke="#2b2724" stroke-width="2"/>
    <circle cx="34" cy="34" r="18" fill="#8b1a1a"/>
    <text x="34" y="41" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#fbf9f5">5</text>
