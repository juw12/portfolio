<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="PART LAB parametric part builder: a 3D mechanical plate with bolt-circle holes, numeric parameter controls, volume/mass stats, and STL export">
  <defs>
    <radialGradient id="paperGlow" cx="22%" cy="15%" r="65%">
      <stop offset="0" stop-color="#f0ede6" stop-opacity="0.50"/>
      <stop offset="1" stop-color="#f0ede6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="inkGlow" cx="82%" cy="88%" r="55%">
      <stop offset="0" stop-color="#d4cfc7" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#d4cfc7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b1a1a"/>
      <stop offset="1" stop-color="#6b1414"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf8f3"/>
      <stop offset="1" stop-color="#f5f1e8"/>
    </linearGradient>
    <linearGradient id="consoleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1a1a"/>
      <stop offset="1" stop-color="#2a2a2a"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8e4dc"/>
      <stop offset="1" stop-color="#d4cfc7"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1a1a1a" flood-opacity="0.08"/>
    </filter>
    <filter id="cardShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#1a1a1a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="#faf8f3"/>
  <rect width="1280" height="720" fill="url(#paperGlow)"/>
  <rect width="1280" height="720" fill="url(#inkGlow)"/>

  <!-- Brand masthead -->
  <g transform="translate(64,46)">
    <rect x="0" y="0" width="48" height="48" rx="8" fill="#8b1a1a"/>
    <path d="M14 34V18h4l6 10 6-10h4v16h-5V24l-4 8h-4l-4-8v10z" fill="#faf8f3"/>
    <text x="64" y="28" fill="#1a1a1a" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700">PART LAB</text>
    <text x="65" y="46" fill="#6b6b6b" font-family="'Segoe UI', Arial, sans-serif" font-size="13">Parametric part builder · offline</text>
  </g>
  <g transform="translate(1080,52)">
    <rect width="140" height="36" rx="10" fill="url(#accentGrad)"/>
    <text x="70" y="23" text-anchor="middle" fill="#faf8f3" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700">Export STL</text>
  </g>

  <!-- Left panel: Parameters -->
  <rect x="64" y="118" width="280" height="474" rx="16" fill="url(#panelGrad)" stroke="#d4cfc7" filter="url(#cardShadow)"/>
  <text x="88" y="150" fill="#8b1a1a" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" letter-spacing="3">PARAMETERS</text>
  <line x1="88" y1="158" x2="200" y2="158" stroke="#8b1a1a" stroke-width="3" opacity="0.15"/>

  <!-- Parameter rows -->
  <g transform="translate(88,176)" font-family="'Courier New', Courier, monospace" font-size="13">
    <!-- Length -->
    <rect x="0" y="0" width="180" height="36" fill="#faf8f3" stroke="#e8e4dc" rx="4"/>
    <text x="12" y="22" fill="#4a4a4a" font-size="11">L</text>
    <text x="160" y="22" text-anchor="end" fill="#1a1a1a" font-weight="700">80</text>

    <!-- Width -->
    <rect x="0" y="42" width="180" height="36" fill="#faf8f3" stroke="#e8e4dc" rx="4"/>
    <text x="12" y="64" fill="#4a4a4a" font-size="11">W</text>
    <text x="160" y="64" text-anchor="end" fill="#1a1a1a" font-weight="700">40</text>

    <!-- Thickness -->
    <rect x="0" y="84" width="180" height="36" fill="#faf8f3" stroke="#e8e4dc" rx="4"/>
    <text x="12" y="106" fill="#4a4a4a" font-size="11">T</text>
    <text x="160" y="106" text-anchor="end" fill="#1a1a1a" font-weight="700">6</text>

    <!-- Bore diameter -->
    <rect x="0" y="126" width="180" height="36" fill="#faf8f3" stroke="#e8e4dc" rx="4"/>
    <text x="12" y="148" fill="#4a4a4a" font-size="11">bore Ø</text>
    <text x="160" y="148" text-anchor="end" fill="#1a1a1a" font-weight="700">4</text>

    <!-- Bolt circle PCD -->
    <rect x="0" y="168" width="180" height="36" fill="#faf8f3" stroke="#e8e4dc" rx="4"/>
    <text x="12" y="190" fill="#4a4a4a" font-size="11">PCD</text>
    <text x="160" y="190" text-anchor="end" fill="#1a1a1a" font-weight="700">60</text>

    <!-- Hole count -->
    <rect x="0" y="210" width="180" height="36" fill="#faf8f3" stroke="#e8e4dc" rx="4"/>
    <text x="12" y="232" fill="#4a4a4a" font-size="11">holes</text>
    <text x="160" y="232" text-anchor="end" fill="#1a1a1a" font-weight="700">6</text>

    <!-- Corner radius -->
    <rect x="0" y="252" width="180" height="36" fill="#faf8f3" stroke="#e8e4dc" rx="4"/>
    <text x="12" y="274" fill="#4a4a4a" font-size="11">R corner</text>
    <text x="160" y="274" text-anchor="end" fill="#1a1a1a" font-weight="700">5</text>

    <!-- Material -->
    <rect x="0" y="294" width="180" height="36" fill="#faf8f3" stroke="#e8e4dc" rx="4"/>
    <text x="12" y="316" fill="#4a4a4a" font-size="11">material</text>
    <text x="160" y="316" text-anchor="end" fill="#1a1a1a" font-weight="700">AL6061</text>
  </g>

  <!-- Center: 3D Part View -->
  <rect x="364" y="118" width="552" height="474" rx="16" fill="#faf8f3" stroke="#d4cfc7" filter="url(#cardShadow)"/>
  <text x="388" y="150" fill="#8b1a1a" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" letter-spacing="3">PREVIEW</text>
  <line x1="388" y1="158" x2="480" y2="158" stroke="#8b1a1a" stroke-width="3" opacity="0.15"/>

  <!-- Isometric plate with bolt circle -->
  <g transform="translate(640,320)">
    <!-- Main plate (isometric) -->
    <path d="M-120 60 L0 0 L120 60 L120 140 L0 200 L-120 140 Z" fill="#faf8f3" stroke="#1a1a1a" stroke-width="2"/>
    <path d="M0 0 L0 80 L120 140 L120 60 Z" fill="#f5f1e8" stroke="#1a1a1a" stroke-width="1.5"/>
    <path d="M0 80 L-120 140 L0 200 L120 140" fill="none" stroke="#1a1a1a" stroke-width="1"/>

    <!-- Rounded corners (simplified as small arcs) -->
    <path d="M-110 55 Q-120 60 -115 70" fill="none" stroke="#8b1a1a" stroke-width="2"/>
    <path d="M110 55 Q120 60 115 70" fill="none" stroke="#8b1a1a" stroke-width="2"/>
    <path d="M-110 135 Q-120 140 -115 150" fill="none" stroke="#8b1a1a" stroke-width="2"/>
    <path d="M110 135 Q120 140 115 150" fill="none" stroke="#8b1a1a" stroke-width="2"/>

    <!-- Bolt circle holes (6 holes in isometric ellipse pattern) -->
    <!-- Front face holes -->
    <ellipse cx="-60" cy="100" rx="10" ry="5" fill="#faf8f3" stroke="#8b1a1a" stroke-width="2"/>
    <ellipse cx="60" cy="100" rx="10" ry="5" fill="#faf8f3" stroke="#8b1a1a" stroke-width="2"/>
    <ellipse cx="-90" cy="140" rx="10" ry="5" fill="#faf8f3" stroke="#8b1a1a" stroke-width="2"/>
    <ellipse cx="90" cy="140" rx="10" ry="5" fill="#faf8f3" stroke="#8b1a1a" stroke-width="2"/>
    <ellipse cx="-60" cy="180" rx="10" ry="5" fill="#faf8f3" stroke="#8b1a1a" stroke-width="2"/>
    <ellipse cx="60" cy="180" rx="10" ry="5" fill="#faf8f3" stroke="#8b1a1a" stroke-width="2"/>

    <!-- Center bore -->
    <ellipse cx="0" cy="140" rx="18" ry="9" fill="#faf8f3" stroke="#8b1a1a" stroke-width="2"/>

    <!-- Dimension lines -->
    <line x1="-140" y1="60" x2="-140" y2="140" stroke="#6b6b6b" stroke-width="1"/>
    <line x1="-145" y1="60" x2="-135" y2="60" stroke="#6b6b6b" stroke-width="1"/>
    <line x1="-145" y1="140" x2="-135" y2="140" stroke="#6b6b6b" stroke-width="1"/>
    <text x="-155" y="105" text-anchor="middle" fill="#6b6b6b" font-family="'Courier New', Courier, monospace" font-size="11">40</text>

    <line x1="-120" y1="220" x2="120" y2="220" stroke="#6b6b6b" stroke-width="1"/>
    <line x1="-120" y1="215" x2="-120" y2="225" stroke="#6b6b6b" stroke-width="1"/>
    <line x1="120" y1="215" x2="120" y2="225" stroke="#6b6b6b" stroke-width="1"/>
    <text x="0" y="240" text-anchor="middle" fill="#6b6b6b" font-family="'Courier New', Courier, monospace" font-size="11">240</text>

    <!-- PCD dimension circle -->
    <ellipse cx="0" cy="140" rx="50" ry="25" fill="none" stroke="#8b1a1a" stroke-width="1" stroke-dasharray="3,2"/>
  </g>

  <!-- Right panel: Stats -->
  <rect x="936" y="118" width="280" height="474" rx="16" fill="url(#panelGrad)" stroke="#d4cfc7" filter="url(#cardShadow)"/>
  <text x="960" y="150" fill="#8b1a1a" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" letter-spacing="3">STATS</text>
  <line x1="960" y1="158" x2="1040" y2="158" stroke="#8b1a1a" stroke-width="3" opacity="0.15"/>

  <!-- Stats rows -->
  <g transform="translate(960,176)" font-family="'Courier New', Courier, monospace" font-size="13">
    <!-- Volume -->
    <rect x="0" y="0" width="232" height="44" fill="#faf8f3" stroke="#e8e4dc" rx="4"/>
    <text x="16" y="24" fill="#4a4a4a" font-size="11">volume</text>
    <text x="216" y="24" text-anchor="end" fill="#1a1a1a" font-weight="700">19,200 mm³</text>

    <!-- Mass -->
    <rect x="0" y="50" width="232" height="44" fill="#faf8f3" stroke="#e8e4dc" rx="4"/>
    <text x="16" y="74" fill="#4a4a4a" font-size="11">mass</text>
    <text x="216" y="74" text-anchor="end" fill="#1a1a1a" font-weight="700">51.8 g</text>

    <!-- Bounding box -->
    <rect x="0" y="100" width="232" height="44" fill="#faf8f3" stroke="#e8e4dc" rx="4"/>
    <text x="16" y="124" fill="#4a4a4a" font-size="11">bbox</text>
    <text x="216" y="124" text-anchor="end" fill="#1a1a1a" font-weight="700">80×40×6 mm</text>

    <!-- Triangles -->
    <rect x="0" y="150" width="232" height="44" fill="#faf8f3" stroke="#e8e4dc" rx="4"/>
    <text x="16" y="174" fill="#4a4a4a" font-size="11">triangles</text>
    <text x="216" y="174" text-anchor="end" fill="#1a1a1a" font-weight="700">1,248</text>

    <!-- Surface area -->
    <rect x="0" y="200" width="232" height="44" fill="#faf8f3" stroke="#e8e4dc" rx="4"/>
    <text x="16" y="224" fill="#4a4a4a" font-size="11">surface</text>
    <text x="216" y="224" text-anchor="end" fill="#1a1a1a" font-weight="700">7,680 mm²</text>

    <!-- Watertight -->
    <rect x="0" y="250" width="232" height="44" fill="#faf8f3" stroke="#e8e4dc" rx="4"/>
    <text x="16" y="274" fill="#4a4a4a" font-size="11">watertight</text>
    <text x="216" y="274" text-anchor="end" fill="#4ec94a" font-weight="700">YES</text>
  </g>

  <!-- Bottom strip: Export options -->
  <rect x="64" y="612" width="1152" height="84" rx="14" fill="url(#panelGrad)" stroke="#d4cfc7" filter="url(#cardShadow)"/>
  <text x="88" y="640" fill="#8b1a1a" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" letter-spacing="3">EXPORT OPTIONS</text>
  <line x1="88" y1="646" x2="240" y2="646" stroke="#8b1a1a" stroke-width="2" opacity="0.3"/>

  <!-- Export cards -->
  <g transform="translate(280,632)">
    <rect width="160" height="52" rx="8" fill="#faf8f3" stroke="#e8e4dc"/>
    <circle cx="24" cy="26" r="8" fill="#4ec94a"/>
    <text x="44" y="22" fill="#1a1a1a" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-weight="700">STL Binary</text>
    <text x="44" y="38" fill="#6b6b6b" font-family="'Segoe UI', Arial, sans-serif" font-size="10">default</text>
  </g>

  <g transform="translate(460,632)">
    <rect width="160" height="52" rx="8" fill="#faf8f3" stroke="#e8e4dc"/>
    <circle cx="24" cy="26" r="8" fill="#f5f1e8" stroke="#d4cfc7"/>
    <text x="44" y="22" fill="#1a1a1a" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-weight="700">STL ASCII</text>
    <text x="44" y="38" fill="#6b6b6b" font-family="'Segoe UI', Arial, sans-serif" font-size="10">readable</text>
  </g>

  <g transform="translate(640,632)">
    <rect width="160" height="52" rx="8" fill="#faf8f3" stroke="#e8e4dc"/>
    <circle cx="24" cy="26" r="8" fill="#f5f1e8" stroke="#d4cfc7"/>
    <text x="44" y="22" fill="#1a1a1a" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-weight="700">STEP AP214</text>
    <text x="44" y="38" fill="#6b6b6b" font-family="'Segoe UI', Arial, sans-serif" font-size="10">parametric</text>
  </g>

  <g transform="translate(820,632)">
    <rect width="160" height="52" rx="8" fill="#faf8f3" stroke="#e8e4dc"/>
    <circle cx="24" cy="26" r="8" fill="#f5f1e8" stroke="#d4cfc7"/>
    <text x="44" y="22" fill="#1a1a1a" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-weight="700">IGES 5.3</text>
    <text x="44" y="38" fill="#6b6b6b" font-family="'Segoe UI', Arial, sans-serif" font-size="10">legacy</text>
  </g>

  <g transform="translate(1000,632)">
    <rect width="160" height="52" rx="8" fill="#faf8f3" stroke="#e8e4dc"/>
    <circle cx="24" cy="26" r="8" fill="#4ec94a"/>
    <text x="44" y="22" fill="#1a1a1a" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-weight="700">Offline</text>
    <text x="44" y="38" fill="#6b6b6b" font-family="'Segoe UI', Arial, sans-serif" font-size="10">no cloud</text>
  </g>
</svg>
