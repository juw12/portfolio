<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Ziris Motor Test Console: a browser app replacing TeraTerm serial workflow with command library, macro notepad, and motor testing interface">
  <defs>
    <radialGradient id="paperGlow" cx="22%" cy="15%" r="65%">
      <stop offset="0" stop-color="#f0ede6" stop-opacity="0.50"/>
      <stop offset="1" stop-color="#f0ede6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="inkGlow" cx="82%" cy="88%" r="55%">
      <stop offset="0" stop-color="#d4cfc7" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#d4cfc7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b1a1a"/>
      <stop offset="1" stop-color="#6b1414"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf8f3"/>
      <stop offset="1" stop-color="#f5f1e8"/>
    </linearGradient>
    <linearGradient id="consoleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1a1a"/>
      <stop offset="1" stop-color="#2a2a2a"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8e4dc"/>
      <stop offset="1" stop-color="#d4cfc7"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1a1a1a" flood-opacity="0.08"/>
    </filter>
    <filter id="cardShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#1a1a1a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="#faf8f3"/>
  <rect width="1280" height="720" fill="url(#paperGlow)"/>
  <rect width="1280" height="720" fill="url(#inkGlow)"/>

  <!-- Brand masthead -->
  <g transform="translate(64,46)">
    <rect x="0" y="0" width="48" height="48" rx="8" fill="#8b1a1a"/>
    <path d="M14 34V18h6l4 10 4-10h6v16h-5V24l-3 8h-4l-3-8v10z" fill="#faf8f3"/>
    <text x="64" y="28" fill="#1a1a1a" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700">ZIRIS MOTOR</text>
    <text x="65" y="46" fill="#6b6b6b" font-family="'Segoe UI', Arial, sans-serif" font-size="13">Motor Test Console</text>
  </g>
  <g transform="translate(1080,52)">
    <rect width="140" height="36" rx="10" fill="url(#accentGrad)"/>
    <text x="70" y="23" text-anchor="middle" fill="#faf8f3" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700">Run Tests</text>
  </g>

  <!-- Left panel: Command Library -->
  <rect x="64" y="118" width="376" height="474" rx="16" fill="url(#panelGrad)" stroke="#d4cfc7" filter="url(#cardShadow)"/>
  <text x="88" y="150" fill="#8b1a1a" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" letter-spacing="3">COMMAND LIBRARY</text>
  <line x1="88" y1="158" x2="416" y2="158" stroke="#8b1a1a" stroke-width="3" opacity="0.15"/>

  <!-- Category: Motor Control -->
  <text x="88" y="188" fill="#1a1a1a" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="700">Motor Control</text>
  <line x1="88" y1="194" x2="200" y2="194" stroke="#8b1a1a" stroke-width="2" opacity="0.3"/>
  
  <g transform="translate(88,206)">
    <rect x="0" y="0" width="264" height="28" fill="#faf8f3" stroke="#e8e4dc"/>
    <text x="12" y="18" fill="#4a4a4a" font-family="'Segoe UI', Arial, sans-serif" font-size="11">MOTOR:INIT</text>
    <rect x="236" y="6" width="16" height="16" rx="3" fill="#8b1a1a"/>
    <path d="M240 14l3 3 5-5" stroke="#faf8f3" stroke-width="2" fill="none" stroke-linecap="round"/>
    
    <rect x="0" y="34" width="264" height="28" fill="#faf8f3" stroke="#e8e4dc"/>
    <text x="12" y="52" fill="#4a4a4a" font-family="'Segoe UI', Arial, sans-serif" font-size="11">MOTOR:STEP:100</text>
    
    <rect x="0" y="68" width="264" height="28" fill="#faf8f3" stroke="#e8e4dc"/>
    <text x="12" y="86" fill="#4a4a4a" font-family="'Segoe UI', Arial, sans-serif" font-size="11">MOTOR:HOME</text>
    
    <rect x="0" y="102" width="264" height="28" fill="#faf8f3" stroke="#e8e4dc"/>
    <text x="12" y="120" fill="#4a4a4a" font-family="'Segoe UI', Arial, sans-serif" font-size="11">MOTOR:STOP</text>
  </g>

  <!-- Category: Sensors -->
  <text x="88" y="318" fill="#1a1a1a" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="700">Sensors</text>
  <line x1="88" y1="324" x2="170" y2="324" stroke="#8b1a1a" stroke-width="2" opacity="0.3"/>
  
  <g transform="translate(88,336)">
    <rect x="0" y="0" width="264" height="28" fill="#faf8f3" stroke="#e8e4dc"/>
    <text x="12" y="18" fill="#4a4a4a" font-family="'Segoe UI', Arial, sans-serif" font-size="11">SENSOR:READ:ALL</text>
    
    <rect x="0" y="34" width="264" height="28" fill="#faf8f3" stroke="#e8e4dc"/>
    <text x="12" y="52" fill="#4a4a4a" font-family="'Segoe UI', Arial, sans-serif" font-size="11">SENSOR:CALIBRATE</text>
    
    <rect x="0" y="68" width="264" height="28" fill="#faf8f3" stroke="#e8e4dc"/>
    <text x="12" y="86" fill="#4a4a4a" font-family="'Segoe UI', Arial, sans-serif" font-size="11">SENSOR:THRESHOLD:50</text>
  </g>

  <!-- Category: Diagnostics -->
  <text x="88" y="478" fill="#1a1a1a" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="700">Diagnostics</text>
  <line x1="88" y1="484" x2="180" y2="484" stroke="#8b1a1a" stroke-width="2" opacity="0.3"/>
  
  <g transform="translate(88,496)">
    <rect x="0" y="0" width="264" height="28" fill="#faf8f3" stroke="#e8e4dc"/>
    <text x="12" y="18" fill="#4a4a4a" font-family="'Segoe UI', Arial, sans-serif" font-size="11">DIAG:SELFTEST</text>
    
    <rect x="0" y="34" width="264" height="28" fill="#faf8f3" stroke="#e8e4dc"/>
    <text x="12" y="52" fill="#4a4a4a" font-family="'Segoe UI', Arial, sans-serif" font-size="11">DIAG:LOG:DUMP</text>
  </g>

  <!-- Main panel: Serial Console -->
  <rect x="464" y="118" width="752" height="474" rx="16" fill="#1a1a1a" stroke="#2a2a2a" filter="url(#cardShadow)"/>
  <text x="488" y="150" fill="#8b1a1a" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" letter-spacing="3">SERIAL CONSOLE</text>
  <line x1="488" y1="158" x2="1192" y2="158" stroke="#8b1a1a" stroke-width="3" opacity="0.15"/>

  <!-- Console output area -->
  <rect x="488" y="168" width="704" height="320" rx="8" fill="url(#consoleGrad)" stroke="#3a3a3a"/>
  
  <!-- Console text lines -->
  <g transform="translate(508,200)" font-family="'Courier New', Courier, monospace" font-size="11">
    <text x="0" y="0" fill="#8b1a1a" font-weight="700">ZIRIS Motor Test Console v2.4</text>
    <text x="0" y="20" fill="#b8b8b8">Connected: COM3 @ 115200 baud</text>
    <text x="0" y="40" fill="#b8b8b8">Device: ARLO ZIRIS Motor Controller</text>
    <text x="0" y="60" fill="#4a4a4a">─────────────────────────────────────</text>
    
    <text x="0" y="88" fill="#6b6b6b">&gt; MOTOR:INIT</text>
    <text x="0" y="108" fill="#4ec94a">[OK] Motor initialized, steps=2048/rev</text>
    
    <text x="0" y="136" fill="#6b6b6b">&gt; SENSOR:READ:ALL</text>
    <text x="0" y="156" fill="#4ec94a">[OK] Temperature: 42°C | Current: 0.8A</text>
    
    <text x="0" y="184" fill="#6b6b6b">&gt; MOTOR:STEP:100</text>
    <text x="0" y="204" fill="#4ec94a">[OK] Moved 100 steps, position=100</text>
    
    <text x="0" y="232" fill="#6b6b6b">&gt; DIAG:SELFTEST</text>
    <text x="0" y="252" fill="#4ec94a">[OK] All sensors nominal, no faults</text>
    
    <text x="0" y="288" fill="#8b1a1a">~ #</text>
    <rect x="28" y="280" width="8" height="16" fill="#8b1a1a" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Right panel: Macro Notepad -->
  <rect x="488" y="500" width="704" height="80" rx="8" fill="#faf8f3" stroke="#d4cfc7"/>
  <text x="508" y="522" fill="#8b1a1a" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-weight="700" letter-spacing="2">MACRO NOTEPAD</text>
  <line x1="508" y1="528" x2="620" y2="528" stroke="#8b1a1a" stroke-width="2" opacity="0.3"/>
  
  <g transform="translate(508,542)" font-family="'Courier New', Courier, monospace" font-size="11">
    <text x="0" y="0" fill="#4a4a4a">1. MOTOR:INIT → 2. SENSOR:CALIBRATE → 3. MOTOR:HOME → 4. RUN:CYCLE:100</text>
    <text x="0" y="22" fill="#6b6b6b">5. DIAG:LOG:DUMP → 6. MOTOR:STOP</text>
  </g>

  <!-- Device illustration: USB-serial cable + motor -->
  <g transform="translate(920,280)">
    <!-- USB connector -->
    <rect x="0" y="0" width="40" height="56" rx="4" fill="#2a2a2a" stroke="#3a3a3a"/>
    <rect x="8" y="8" width="24" height="16" rx="2" fill="#3a3a3a"/>
    <rect x="12" y="12" width="4" height="4" fill="#4ec94a" opacity="0.8"/>
    <rect x="24" y="12" width="4" height="4" fill="#4ec94a" opacity="0.8"/>
    <text x="20" y="44" text-anchor="middle" fill="#6b6b6b" font-family="'Segoe UI', Arial, sans-serif" font-size="9">USB</text>
    
    <!-- Cable -->
    <path d="M20 56 C20 80, 60 80, 60 100" stroke="#3a3a3a" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M24 56 C24 76, 56 76, 56 96" stroke="#2a2a2a" stroke-width="2" fill="none" stroke-linecap="round"/>
    
    <!-- Serial connector -->
    <rect x="40" y="100" width="48" height="32" rx="3" fill="#2a2a2a" stroke="#3a3a3a"/>
    <rect x="46" y="108" width="8" height="8" fill="#3a3a3a"/>
    <rect x="60" y="108" width="8" height="8" fill="#3a3a3a"/>
    <rect x="74" y="108" width="8" height="8" fill="#3a3a3a"/>
    <text x="64" y="126" text-anchor="middle" fill="#6b6b6b" font-family="'Segoe UI', Arial, sans-serif" font-size="8">RS232</text>
    
    <!-- Motor icon -->
    <g transform="translate(140,60)">
      <circle cx="40" cy="40" r="36" fill="none" stroke="#8b1a1a" stroke-width="2"/>
      <circle cx="40" cy="40" r="28" fill="#2a2a2a" stroke="#3a3a3a" stroke-width="2"/>
      <circle cx="40" cy="40" r="8" fill="#8b1a1a"/>
      <path d="M40 12 L40 24" stroke="#3a3a3a" stroke-width="3" stroke-linecap="round"/>
      <path d="M40 56 L40 68" stroke="#3a3a3a" stroke-width="3" stroke-linecap="round"/>
      <path d="M12 40 L24 40" stroke="#3a3a3a" stroke-width="3" stroke-linecap="round"/>
      <path d="M56 40 L68 40" stroke="#3a3a3a" stroke-width="3" stroke-linecap="round"/>
      <text x="40" y="92" text-anchor="middle" fill="#6b6b6b" font-family="'Segoe UI', Arial, sans-serif" font-size="10">MOTOR</text>
    </g>
  </g>

  <!-- Bottom strip: Connection status -->
  <rect x="64" y="612" width="1152" height="84" rx="14" fill="url(#panelGrad)" stroke="#d4cfc7" filter="url(#cardShadow)"/>
  <text x="88" y="640" fill="#8b1a1a" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" letter-spacing="3">CONNECTION STATUS</text>
  <line x1="88" y1="646" x2="260" y2="646" stroke="#8b1a1a" stroke-width="2" opacity="0.3"/>
  
  <!-- Status indicators -->
  <g transform="translate(300,632)">
    <rect width="140" height="52" rx="8" fill="#faf8f3" stroke="#e8e4dc"/>
    <circle cx="24" cy="26" r="8" fill="#4ec94a"/>
    <text x="44" y="22" fill="#1a1a1a" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-weight="700">COM3</text>
    <text x="44" y="38" fill="#6b6b6b" font-family="'Segoe UI', Arial, sans-serif" font-size="10">115200 baud</text>
  </g>
  
  <g transform="translate(460,632)">
    <rect width="140" height="52" rx="8" fill="#faf8f3" stroke="#e8e4dc"/>
    <circle cx="24" cy="26" r="8" fill="#4ec94a"/>
    <text x="44" y="22" fill="#1a1a1a" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-weight="700">Device</text>
    <text x="44" y="38" fill="#6b6b6b" font-family="'Segoe UI', Arial, sans-serif" font-size="10">ARLO ZIRIS</text>
  </g>
  
  <g transform="translate(620,632)">
    <rect width="140" height="52" rx="8" fill="#faf8f3" stroke="#e8e4dc"/>
    <circle cx="24" cy="26" r="8" fill="#4ec94a"/>
    <text x="44" y="22" fill="#1a1a1a" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-weight="700">Motor</text>
    <text x="44" y="38" fill="#6b6b6b" font-family="'Segoe UI', Arial, sans-serif" font-size="10">Initialized</text>
  </g>
  
  <g transform="translate(780,632)">
    <rect width="140" height="52" rx="8" fill="#faf8f3" stroke="#e8e4dc"/>
    <circle cx="24" cy="26" r="8" fill="#f5f1e8" stroke="#d4cfc7"/>
    <text x="44" y="22" fill="#4a4a4a" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-weight="700">Sensors</text>
    <text x="44" y="38" fill="#6b6b6b" font-family="'Segoe UI', Arial, sans-serif" font-size="10">Nominal</text>
  </g>
  
  <g transform="translate(940,632)">
    <rect width="140" height="52" rx="8" fill="#faf8f3" stroke="#e8e4dc"/>
    <circle cx="24" cy="26" r="8" fill="#f5f1e8" stroke="#d4cfc7"/>
    <text x="44" y="22" fill="#4a4a4a" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-weight="700">Tests</text>
    <text x="44" y="38" fill="#6b6b6b" font-family="'Segoe UI', Arial, sans-serif" font-size="10">Ready</text>
  </g>
</svg>
