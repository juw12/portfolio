<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Outlook Archiver: Windows daemon keeping Inbox and Sent clean by archiving messages to a PST file — shows email flow, archive box, toast notification, and running log">
  <defs>
    <radialGradient id="paperGlow" cx="22%" cy="15%" r="65%">
      <stop offset="0" stop-color="#f0ede6" stop-opacity="0.50"/>
      <stop offset="1" stop-color="#f0ede6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="inkGlow" cx="82%" cy="88%" r="55%">
      <stop offset="0" stop-color="#d4cfc7" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#d4cfc7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b1a1a"/>
      <stop offset="1" stop-color="#6b1414"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf8f3"/>
      <stop offset="1" stop-color="#f5f1e8"/>
    </linearGradient>
    <linearGradient id="envelopeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f5f1e8"/>
    </linearGradient>
    <linearGradient id="archiveGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b1a1a"/>
      <stop offset="1" stop-color="#6b1212"/>
    </linearGradient>
    <filter id="cardShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#1a1a1a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="#faf8f3"/>
  <rect width="1280" height="720" fill="url(#paperGlow)"/>
  <rect width="1280" height="720" fill="url(#inkGlow)"/>

  <!-- Brand masthead -->
  <g transform="translate(64,46)">
    <rect x="0" y="0" width="48" height="48" rx="8" fill="#8b1a1a"/>
    <!-- Envelope icon -->
    <path d="M12 14h24v20H12z" fill="none" stroke="#faf8f3" stroke-width="2"/>
    <path d="M12 14l12 10 12-10" fill="none" stroke="#faf8f3" stroke-width="2" stroke-linecap="round"/>
    <text x="64" y="28" fill="#1a1a1a" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700">OUTLOOK ARCHIVER</text>
    <text x="65" y="46" fill="#6b6b6b" font-family="'Segoe UI', Arial, sans-serif" font-size="13">Inbox zero, automatically</text>
  </g>
  <g transform="translate(1080,52)">
    <rect width="140" height="36" rx="10" fill="url(#accentGrad)"/>
    <text x="70" y="23" text-anchor="middle" fill="#faf8f3" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700">Daemon Active</text>
  </g>

  <!-- Left panel: Mail Flow -->
  <rect x="64" y="118" width="376" height="474" rx="16" fill="url(#panelGrad)" stroke="#d4cfc7" filter="url(#cardShadow)"/>
  <text x="88" y="150" fill="#8b1a1a" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" letter-spacing="3">MAIL FLOW</text>
  <line x1="88" y1="158" x2="416" y2="158" stroke="#8b1a1a" stroke-width="3" opacity="0.15"/>

  <!-- Inbox section -->
  <text x="88" y="188" fill="#1a1a1a" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="700">INBOX</text>
  <rect x="88" y="202" width="304" height="64" rx="8" fill="#faf8f3" stroke="#e8e4dc"/>
  <!-- Envelope 1 -->
  <g transform="translate(102,216)">
    <rect width="48" height="36" rx="4" fill="url(#envelopeGrad)" stroke="#d4cfc7"/>
    <path d="M0 0l24 18L48 0" fill="none" stroke="#8b1a1a" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <!-- Envelope 2 -->
  <g transform="translate(164,216)">
    <rect width="48" height="36" rx="4" fill="url(#envelopeGrad)" stroke="#d4cfc7"/>
    <path d="M0 0l24 18L48 0" fill="none" stroke="#8b1a1a" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <!-- Envelope 3 -->
  <g transform="translate(226,216)">
    <rect width="48" height="36" rx="4" fill="url(#envelopeGrad)" stroke="#d4cfc7"/>
    <path d="M0 0l24 18L48 0" fill="none" stroke="#8b1a1a" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <text x="320" y="238" fill="#6b6b6b" font-family="'Segoe UI', Arial, sans-serif" font-size="11">+12 more</text>

  <!-- Arrow down -->
  <g transform="translate(238,290)">
    <path d="M0 0v24M-8 16l8 8 8-8" fill="none" stroke="#8b1a1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Archive processing -->
  <text x="88" y="340" fill="#1a1a1a" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="700">ARCHIVING</text>
  <rect x="88" y="354" width="304" height="72" rx="8" fill="#faf8f3" stroke="#e8e4dc"/>
  <!-- Cog icon -->
  <g transform="translate(110,390)">
    <circle cx="0" cy="0" r="14" fill="none" stroke="#8b1a1a" stroke-width="2"/>
    <circle cx="0" cy="0" r="5" fill="#8b1a1a"/>
    <path d="M0-18v-6M0 18v6M-18 0h-6M18 0h6M-13-13l-4-4M13 13l4 4M-13 13l-4 4M13-13l4-4" stroke="#8b1a1a" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="140" y="386" fill="#4a4a4a" font-family="'Segoe UI', Arial, sans-serif" font-size="11">Processing...</text>
  <text x="140" y="404" fill="#6b6b6b" font-family="'Segoe UI', Arial, sans-serif" font-size="10">Moving to PST archive</text>
  <!-- Progress bar -->
  <rect x="140" y="414" width="140" height="6" rx="3" fill="#e8e4dc"/>
  <rect x="140" y="414" width="98" height="6" rx="3" fill="url(#accentGrad)"/>

  <!-- Arrow down -->
  <g transform="translate(238,450)">
    <path d="M0 0v24M-8 16l8 8 8-8" fill="none" stroke="#8b1a1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Sent Items section -->
  <text x="88" y="500" fill="#1a1a1a" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="700">SENT ITEMS</text>
  <rect x="88" y="514" width="304" height="64" rx="8" fill="#faf8f3" stroke="#e8e4dc"/>
  <!-- Envelope 1 -->
  <g transform="translate(102,528)">
    <rect width="48" height="36" rx="4" fill="url(#envelopeGrad)" stroke="#d4cfc7"/>
    <path d="M0 0l24 18L48 0" fill="none" stroke="#8b1a1a" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <!-- Envelope 2 -->
  <g transform="translate(164,528)">
    <rect width="48" height="36" rx="4" fill="url(#envelopeGrad)" stroke="#d4cfc7"/>
    <path d="M0 0l24 18L48 0" fill="none" stroke="#8b1a1a" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <text x="220" y="550" fill="#6b6b6b" font-family="'Segoe UI', Arial, sans-serif" font-size="11">+5 more</text>

  <!-- Right panel: Archive Storage -->
  <rect x="464" y="118" width="752" height="474" rx="16" fill="#faf8f3" stroke="#d4cfc7" filter="url(#cardShadow)"/>
  <text x="488" y="150" fill="#8b1a1a" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" letter-spacing="3">ARCHIVE STORAGE</text>
  <line x1="488" y1="158" x2="1192" y2="158" stroke="#8b1a1a" stroke-width="3" opacity="0.15"/>

  <!-- PST Archive Box -->
  <g transform="translate(512,190)">
    <!-- Box body -->
    <rect x="0" y="40" width="280" height="180" rx="8" fill="#f5f1e8" stroke="#d4cfc7" stroke-width="2"/>
    <!-- Box lid -->
    <rect x="-8" y="20" width="296" height="30" rx="6" fill="url(#archiveGrad)"/>
    <text x="140" y="42" text-anchor="middle" fill="#faf8f3" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700">ARCHIVES.PST</text>
    <!-- Label on box -->
    <rect x="20" y="60" width="240" height="32" rx="4" fill="#faf8f3" stroke="#e8e4dc"/>
    <text x="140" y="82" text-anchor="middle" fill="#1a1a1a" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="700">Outlook Archives</text>
    <!-- Stacked envelopes inside -->
    <g transform="translate(40,110)">
      <rect width="200" height="80" rx="4" fill="#faf8f3" stroke="#e8e4dc"/>
      <rect x="10" y="10" width="180" height="8" rx="2" fill="#e8e4dc"/>
      <rect x="10" y="24" width="160" height="8" rx="2" fill="#e8e4dc"/>
      <rect x="10" y="38" width="170" height="8" rx="2" fill="#e8e4dc"/>
      <rect x="10" y="52" width="140" height="8" rx="2" fill="#e8e4dc"/>
    </g>
  </g>

  <!-- Folder tree -->
  <g transform="translate(840,190)">
    <text x="0" y="14" fill="#1a1a1a" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700">FOLDER STRUCTURE</text>
    <line x1="0" y1="20" x2="180" y2="20" stroke="#8b1a1a" stroke-width="2" opacity="0.3"/>
    
    <!-- Folder items -->
    <g transform="translate(0,40)">
      <path d="M0 0h16v12H0z" fill="none" stroke="#8b1a1a" stroke-width="1.5"/>
      <path d="M4 0v12M8 6h8" stroke="#8b1a1a" stroke-width="1.5"/>
      <text x="24" y="10" fill="#4a4a4a" font-family="'Segoe UI', Arial, sans-serif" font-size="11">Inbox (2,847)</text>
    </g>
    
    <g transform="translate(0,68)">
      <path d="M0 0h16v12H0z" fill="none" stroke="#8b1a1a" stroke-width="1.5"/>
      <path d="M4 0v12M8 6h8" stroke="#8b1a1a" stroke-width="1.5"/>
      <text x="24" y="10" fill="#4a4a4a" font-family="'Segoe UI', Arial, sans-serif" font-size="11">Sent Items (1,523)</text>
    </g>
    
    <g transform="translate(0,96)">
      <path d="M0 0h16v12H0z" fill="none" stroke="#8b1a1a" stroke-width="1.5"/>
      <path d="M4 0v12M8 6h8" stroke="#8b1a1a" stroke-width="1.5"/>
      <text x="24" y="10" fill="#4a4a4a" font-family="'Segoe UI', Arial, sans-serif" font-size="11">Drafts (12)</text>
    </g>
    
    <g transform="translate(0,124)">
      <path d="M0 0h16v12H0z" fill="none" stroke="#8b1a1a" stroke-width="1.5"/>
      <path d="M4 0v12M8 6h8" stroke="#8b1a1a" stroke-width="1.5"/>
      <text x="24" y="10" fill="#4a4a4a" font-family="'Segoe UI', Arial, sans-serif" font-size="11">Deleted (89)</text>
    </g>
    
    <!-- Separator -->
    <line x1="0" y1="150" x2="340" y2="150" stroke="#e8e4dc" stroke-width="1"/>
    
    <!-- Archive summary -->
    <text x="0" y="174" fill="#1a1a1a" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-weight="700">TOTAL ARCHIVED</text>
    <text x="0" y="196" fill="#8b1a1a" font-family="'Courier New', Courier, monospace" font-size="24" font-weight="700">4,471</text>
    <text x="80" y="200" fill="#6b6b6b" font-family="'Segoe UI', Arial, sans-serif" font-size="11">messages</text>
  </g>

  <!-- Toast notification -->
  <g transform="translate(840,420)">
    <rect x="0" y="0" width="340" height="72" rx="10" fill="#faf8f3" stroke="#8b1a1a" stroke-width="2" filter="url(#cardShadow)"/>
    <!-- Check icon -->
    <circle cx="28" cy="36" r="18" fill="#8b1a1a"/>
    <path d="M18 36l7 7 13-13" fill="none" stroke="#faf8f3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="30" fill="#1a1a1a" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700">New mail archived</text>
    <text x="60" y="50" fill="#6b6b6b" font-family="'Segoe UI', Arial, sans-serif" font-size="11">Moved to Archives.PST · 2 min ago</text>
  </g>

  <!-- Rolling log strip -->
  <g transform="translate(512,320)">
    <text x="0" y="14" fill="#1a1a1a" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700">ACTIVITY LOG</text>
    <line x1="0" y1="20" x2="140" y2="20" stroke="#8b1a1a" stroke-width="2" opacity="0.3"/>
    
    <!-- Log entries -->
    <rect x="0" y="34" width="310" height="24" rx="4" fill="#f5f1e8" stroke="#e8e4dc"/>
    <text x="12" y="50" fill="#4a4a4a" font-family="'Courier New', Courier, monospace" font-size="10">10:42:18 · Inbox → Archives (23)</text>
    
    <rect x="0" y="64" width="310" height="24" rx="4" fill="#faf8f3" stroke="#e8e4dc"/>
    <text x="12" y="80" fill="#6b6b6b" font-family="'Courier New', Courier, monospace" font-size="10">10:38:05 · Sent → Archives (12)</text>
    
    <rect x="0" y="94" width="310" height="24" rx="4" fill="#faf8f3" stroke="#e8e4dc"/>
    <text x="12" y="110" fill="#6b6b6b" font-family="'Courier New', Courier, monospace" font-size="10">10:31:42 · Inbox → Archives (8)</text>
    
    <rect x="0" y="124" width="310" height="24" rx="4" fill="#faf8f3" stroke="#e8e4dc"/>
    <text x="12" y="140" fill="#6b6b6b" font-family="'Courier New', Courier, monospace" font-size="10">10:27:19 · Sent → Archives (31)</text>
  </g>

  <!-- Windows daemon indicator -->
  <g transform="translate(1080,320)">
    <text x="0" y="14" fill="#1a1a1a" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700">DAEMON STATUS</text>
    <line x1="0" y1="20" x2="140" y2="20" stroke="#8b1a1a" stroke-width="2" opacity="0.3"/>
    
    <!-- Status indicator -->
    <rect x="0" y="34" width="140" height="48" rx="8" fill="#f5f1e8" stroke="#8b1a1a"/>
    <circle cx="24" cy="58" r="8" fill="#8b1a1a"/>
    <circle cx="24" cy="58" r="4" fill="#faf8f3"/>
    <text x="42" y="54" fill="#1a1a1a" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700">RUNNING</text>
    <text x="42" y="68" fill="#6b6b6b" font-family="'Segoe UI', Arial, sans-serif" font-size="9">Background service</text>
    
    <!-- Config -->
    <rect x="0" y="90" width="140" height="64" rx="8" fill="#faf8f3" stroke="#e8e4dc"/>
    <text x="12" y="110" fill="#4a4a4a" font-family="'Segoe UI', Arial, sans-serif" font-size="10">Check interval: 5 min</text>
    <text x="12" y="126" fill="#4a4a4a" font-family="'Segoe UI', Arial, sans-serif" font-size="10">Auto-start: enabled</text>
    <text x="12" y="142" fill="#4a4a4a" font-family="'Segoe UI', Arial, sans-serif" font-size="10">Last run: 10:42</text>
  </g>

  <!-- Bottom strip: Archive stats -->
  <rect x="64" y="612" width="1152" height="84" rx="14" fill="url(#panelGrad)" stroke="#d4cfc7" filter="url(#cardShadow)"/>
  <text x="88" y="640" fill="#8b1a1a" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" letter-spacing="3">ARCHIVE STATISTICS</text>
  <line x1="88" y1="646" x2="260" y2="646" stroke="#8b1a1a" stroke-width="2" opacity="0.3"/>
  
  <!-- Stat 1 -->
  <g transform="translate(300,632)">
    <rect width="140" height="52" rx="8" fill="#faf8f3" stroke="#e8e4dc"/>
    <text x="14" y="24" fill="#6b6b6b" font-family="'Segoe UI', Arial, sans-serif" font-size="10">Inbox cleaned</text>
    <text x="14" y="42" fill="#1a1a1a" font-family="'Courier New', Courier, monospace" font-size="16" font-weight="700">2,847</text>
  </g>
  
  <!-- Stat 2 -->
  <g transform="translate(460,632)">
    <rect width="140" height="52" rx="8" fill="#faf8f3" stroke="#e8e4dc"/>
    <text x="14" y="24" fill="#6b6b6b" font-family="'Segoe UI', Arial, sans-serif" font-size="10">Sent archived</text>
    <text x="14" y="42" fill="#1a1a1a" font-family="'Courier New', Courier, monospace" font-size="16" font-weight="700">1,523</text>
  </g>
  
  <!-- Stat 3 -->
  <g transform="translate(620,632)">
    <rect width="140" height="52" rx="8" fill="#faf8f3" stroke="#e8e4dc"/>
    <text x="14" y="24" fill="#6b6b6b" font-family="'Segoe UI', Arial, sans-serif" font-size="10">Storage saved</text>
    <text x="14" y="42" fill="#1a1a1a" font-family="'Courier New', Courier, monospace" font-size="16" font-weight="700">1.2 GB</text>
  </g>
  
  <!-- Stat 4 -->
  <g transform="translate(780,632)">
    <rect width="140" height="52" rx="8" fill="#f5f1e8" stroke="#8b1a1a"/>
    <text x="14" y="24" fill="#8b1a1a" font-family="'Segoe UI', Arial, sans-serif" font-size="10">Days running</text>
    <text x="14" y="42" fill="#8b1a1a" font-family="'Courier New', Courier, monospace" font-size="16" font-weight="700">47</text>
  </g>
  
  <!-- Stat 5 -->
  <g transform="translate(940,632)">
    <rect width="140" height="52" rx="8" fill="#faf8f3" stroke="#e8e4dc"/>
    <text x="14" y="24" fill="#6b6b6b" font-family="'Segoe UI', Arial, sans-serif" font-size="10">Auto-archives</text>
    <text x="14" y="42" fill="#1a1a1a" font-family="'Courier New', Courier, monospace" font-size="16" font-weight="700">ON</text>
  </g>
</svg>