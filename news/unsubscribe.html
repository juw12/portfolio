<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Unsubscribe · AI Daily</title>
<style>
:root{--bg:#f7f6f2;--ink:#14161a;--ink2:#474c55;--line:#e7e4dd;--accent:#3346c4}
@media (prefers-color-scheme:dark){:root{--bg:#0e0f11;--ink:#ecebe7;--ink2:#b9b7b1;--line:#24272b;--accent:#8fa0ff}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.card{width:min(440px,92vw);padding:32px 28px;border:1px solid var(--line);border-radius:16px}
h1{margin:0 0 8px;font:700 26px Georgia,serif}p{margin:0 0 18px;color:var(--ink2)}
input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--ink);font:inherit;margin-bottom:12px}
button{width:100%;padding:12px 16px;border:0;border-radius:12px;background:var(--accent);color:#fff;font:600 15px system-ui,sans-serif;cursor:pointer}
button[disabled]{opacity:.6}.note{margin-top:14px;font-size:14px}a{color:var(--accent)}
</style>
</head>
<body>
<main class="card">
  <h1>Unsubscribe</h1>
  <p>Stop receiving AI Daily at this address. You can come back anytime.</p>
  <form id="leave">
    <label for="email" style="position:absolute;left:-999px">Email</label>
    <input id="email" type="email" required placeholder="you@example.com" autocomplete="email">
    <button type="submit">Unsubscribe</button>
  </form>
  <p class="note" id="note" role="status" aria-live="polite"></p>
  <p class="note"><a href="./">Back to today's AI Daily</a></p>
</main>
<script src="../assets/subscribe.js"></script>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var input = document.getElementById("email");
  var note = document.getElementById("note");
  var form = document.getElementById("leave");
  input.value = params.get("e") || "";
  form.addEventListener("submit", function (event) {
    event.preventDefault();
    var email = input.value.trim();
    if (!email || !window.JL_NEWSLETTER.inbox) {
      note.textContent = "Reply to any AI Daily email with the word 'unsubscribe' and you'll be removed.";
      return;
    }
    form.querySelector("button").disabled = true;
    window.JLNewsletter.leaveAiDaily(email)
      .then(function () {
        note.textContent = "Done. You won't get AI Daily from tomorrow on.";
        form.remove();
      })
      .catch(function () {
        form.querySelector("button").disabled = false;
        note.textContent = "Couldn't reach the list. Reply 'unsubscribe' to any AI Daily email instead.";
      });
  });
})();
</script>
</body>
</html>
